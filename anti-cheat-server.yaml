apiVersion: apps/v1
kind: Deployment
metadata:
  name: anti-cheat-server
  labels:
    app: anti-cheat-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anti-cheat-server
  template:
    metadata:
      labels:
        app: anti-cheat-server
    spec:
      containers:
        - name: anti-cheat-server
          image: daev681/daev681:anti-cheat-server
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: my-secret
