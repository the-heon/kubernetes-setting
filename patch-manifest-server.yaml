apiVersion: apps/v1
kind: Deployment
metadata:
  name: patch-manifest-server
  labels:
    app: patch-manifest-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patch-manifest-server
  template:
    metadata:
      labels:
        app: patch-manifest-server
    spec:
      containers:
        - name: patch-manifest-server
          image: daev681/daev681:patch-manifest-server
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: my-secret
