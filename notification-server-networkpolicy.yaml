# notification-server api 로 들어오는 요청은 api-gateway 에서 온 것만 받습니다.
# 관리자 API 는 kubectl port-forward 로 부릅니다(port-forward 는 이 정책을 거치지 않음).
# 나가는 쪽은 막지 않습니다: Postgres 와 FCM(인터넷 443)에 연결해야 합니다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notification-server-networkpolicy
spec:
  podSelector:
    matchLabels:
      app: notification-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8080
---
# worker 는 요청을 받을 일이 없습니다. (노드에서 오는 kubelet 프로브는 대부분의 CNI 에서 허용됩니다.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notification-server-worker-networkpolicy
spec:
  podSelector:
    matchLabels:
      app: notification-server-worker
  policyTypes:
    - Ingress
  ingress: []
