apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  gateway-secret-key: change-this-gateway-secret-min-16
  hmac-secret: change-this-hmac-secret-min-32
  jwt-secret: change-this-jwt-secret-min-32
  jwt-refresh-secret: change-this-jwt-refresh-secret-min-32
  realtime-api-key: change-this-realtime-api-key
  postgres-database-url: postgres://postgres:postgres@postgres-service:5432/game_platform?sslmode=disable
  redis-addr: redis-service:6379
  redis-password: ""
  redis-db: "0"
