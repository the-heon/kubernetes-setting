apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  # 아래 네 값은 32바이트 이상이어야 합니다. 짧으면 api-gateway·api-server 가 시작하지 않습니다 (openssl rand -base64 48).
  # gateway-secret-key 와 hmac-secret 은 같은 값이어야 합니다 (게이트웨이가 서명하고 api-server 가 확인).
  gateway-secret-key: change-this-gateway-secret-min-32
  hmac-secret: change-this-hmac-secret-min-32
  jwt-secret: change-this-jwt-secret-min-32
  jwt-refresh-secret: change-this-jwt-refresh-secret-min-32
  # api-server 첫 관리자 (선택). 관리자가 한 명도 없을 때만 만들고, 만든 뒤에는 지워도 됩니다.
  # 비밀번호는 12자 이상이고 보안정책도 통과해야 합니다 - 아니면 api-server 가 시작하지 않습니다.
  initial-admin-email: ops@example.com
  initial-admin-password: change-this-initial-admin-password
  game-server-api-key: change-this-game-server-api-key
  # Postgres 관리자(postgres) 비밀번호: postgres.yaml·api-server·DB 초기화 Job·백업이 함께 씁니다 (openssl rand -hex 24).
  # 비어 있는 데이터 폴더를 처음 만들 때만 적용됩니다. 이미 만든 DB 면 README 의 "DB·Redis 비밀번호" 를 보세요.
  postgres-password: change-this-postgres-password
  # Redis 비밀번호: redis.yaml(--requirepass)과 api-server 가 함께 씁니다 (openssl rand -hex 24). 비우면 비밀번호 없이 뜹니다.
  redis-password: change-this-redis-password
  # 아래 세 값은 지금 매니페스트에서 쓰지 않습니다.
  postgres-database-url: postgres://postgres:postgres@postgres-service:5432/game_platform?sslmode=disable
  redis-addr: redis-service:6379
  redis-db: "0"
  # notification-server. 아래 세 값은 일부러 쓸 수 없는 값으로 두었습니다 - 바꾸지 않으면 알림 서버가 시작하지 않습니다.
  # 관리자 API 토큰 (32자 이상): openssl rand -hex 32
  notification-admin-token: change-me
  # FCM 자격증명 암호화 키 (base64 32바이트): openssl rand -base64 32
  # 한 번 정하면 바꾸지 않습니다. 바꾸면 이미 저장한 FCM 자격증명을 복호화할 수 없어 다시 등록해야 합니다.
  notification-credentials-key: change-me
  # notification_server DB 계정 비밀번호. DB 주소에 그대로 들어가므로 영문·숫자만: openssl rand -hex 24
  notification-db-password: change-me
  # mobile-api-server.
  # 관리자 API 토큰 (32자 이상): openssl rand -hex 32. 32자보다 짧으면 서버가 시작하지 않습니다 (change-me 그대로 두면 시작하지 않음).
  mobile-api-admin-token: change-me
  # mobile_api_server DB 계정 비밀번호: openssl rand -hex 24
  mobile-api-db-password: change-me
