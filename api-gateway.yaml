apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 2  # 원하는 만큼 스케일링 가능
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: daev681/daev681:api-gateway  # 빌드된 Docker 이미지 이름
          imagePullPolicy: Always  # 강제로 이미지 다운로드
          ports:
            - name: http
              containerPort: 5000  # Go 애플리케이션이 열어놓은 포트
          env:
            - name: AUTH_SERVER_HOST
              value: "http://api-server-service"  # API 서버 호스트 (내부 서비스명)
            - name: AUTH_SERVER_PORT
              value: "8080"  # API 서버 포트
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: gateway-secret-key
            - name: UPSTREAM_TIMEOUT_SECONDS
              value: "15"
            - name: REALTIME_SERVER_HOST
              value: "http://realtime-server-service"
            - name: REALTIME_SERVER_HEALTH_PORT
              value: "8081"
            - name: AUTH_HEALTH_HOST
              value: "http://auth-server-service"
            - name: AUTH_HEALTH_PORT
              value: "8080"
            - name: MATCHMAKING_HEALTH_HOST
              value: "http://matchmaking-server-service"
            - name: MATCHMAKING_HEALTH_PORT
              value: "8080"
            - name: SESSION_ORCHESTRATOR_HEALTH_HOST
              value: "http://session-orchestrator-service"
            - name: SESSION_ORCHESTRATOR_HEALTH_PORT
              value: "8080"
            - name: ECONOMY_HEALTH_HOST
              value: "http://economy-server-service"
            - name: ECONOMY_HEALTH_PORT
              value: "8080"
            - name: LIVEOPS_HEALTH_HOST
              value: "http://liveops-config-server-service"
            - name: LIVEOPS_HEALTH_PORT
              value: "8080"
            - name: RANKING_HEALTH_HOST
              value: "http://ranking-stats-server-service"
            - name: RANKING_HEALTH_PORT
              value: "8080"
            - name: EVENTBUS_HEALTH_HOST
              value: "http://event-bus-gateway-service"
            - name: EVENTBUS_HEALTH_PORT
              value: "8080"
            - name: CACHE_HEALTH_HOST
              value: "http://cache-proxy-server-service"
            - name: CACHE_HEALTH_PORT
              value: "8080"
            - name: AUDIT_HEALTH_HOST
              value: "http://audit-trail-server-service"
            - name: AUDIT_HEALTH_PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      imagePullSecrets:
        - name: my-secret  # 시크릿 이름을 여기에 지정

