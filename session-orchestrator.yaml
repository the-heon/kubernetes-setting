apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-orchestrator
  labels:
    app: session-orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session-orchestrator
  template:
    metadata:
      labels:
        app: session-orchestrator
    spec:
      containers:
        - name: session-orchestrator
          image: daev681/daev681:session-orchestrator
          imagePullPolicy: Always
          env:
            - name: DEFAULT_REALTIME_TARGET
              value: realtime-server-service:4000
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: my-secret
