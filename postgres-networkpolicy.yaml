# Postgres 에는 DB 를 쓰는 서버와 DB 관리 작업만 붙습니다.
# - api-server(game_platform), notification-server·worker(notification_server), mobile-api-server(mobile_api_server)
# - role: postgres-admin 라벨의 파드: DB 초기화 Job(*-db-init.yaml)과 백업 CronJob(postgres-backup.yaml)
# 새로 DB 를 쓰는 서버를 더하면 여기에도 더해야 합니다 (안 더하면 그 서버가 DB 에 붙지 못합니다).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-networkpolicy
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-server
        - podSelector:
            matchLabels:
              app: notification-server
        - podSelector:
            matchLabels:
              app: notification-server-worker
        - podSelector:
            matchLabels:
              app: mobile-api-server
        - podSelector:
            matchLabels:
              role: postgres-admin
      ports:
        - protocol: TCP
          port: 5432
