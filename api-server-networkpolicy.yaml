# api-server 에는 api-gateway(웹 요청), game-server(서버 등록·트래픽 정책), prometheus(지표)만 붙습니다.
# api-server 는 게이트웨이 서명 없는 요청을 거부하지만, 본문을 다 읽은 뒤에 거부하므로 다른 파드가 큰 요청으로 괴롭힐 수 있습니다.
# kubelet 의 상태 확인(probe)은 노드에서 오므로 이 정책과 상관없이 통과합니다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-server-networkpolicy
spec:
  podSelector:
    matchLabels:
      app: api-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: game-server
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
