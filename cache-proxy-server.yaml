apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-proxy-server
  labels:
    app: cache-proxy-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cache-proxy-server
  template:
    metadata:
      labels:
        app: cache-proxy-server
    spec:
      containers:
        - name: cache-proxy-server
          image: daev681/daev681:cache-proxy-server
          imagePullPolicy: Always
          env:
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: redis-addr
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: redis-password
            - name: REDIS_DB
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: redis-db
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: my-secret
