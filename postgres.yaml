# 데이터는 디스크(PVC)에 둡니다. 파드가 다시 떠도(이미지 업데이트·노드 재부팅 등) 데이터가 남습니다.
# storageClassName 을 비워 두어 클러스터의 기본 StorageClass 를 씁니다. 기본 StorageClass 가 없는 클러스터면
# PVC 가 Pending 에 머물고 Postgres 가 뜨지 않습니다 (kubectl get storageclass 로 확인).
# 백업은 postgres-backup.yaml (매일 pg_dumpall).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  # 디스크(ReadWriteOnce)는 파드 하나만 붙일 수 있으므로, 새 파드는 이전 파드가 내려간 뒤에 띄웁니다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          # 메이저 버전을 고정합니다. latest 로 두면 새 메이저가 나왔을 때 기존 데이터를 읽지 못해 시작하지 못합니다.
          image: postgres:18
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: postgres
            # 비어 있는 데이터 폴더를 처음 만들 때만 쓰입니다. 이미 만든 DB 는 이 값을 바꿔도 비밀번호가 바뀌지 않습니다
            # (README 의 "DB·Redis 비밀번호" 참고).
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: game_platform
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            # 18 부터 이미지가 /var/lib/postgresql/18/docker 에 데이터를 둡니다.
            # 예전 위치(/var/lib/postgresql/data)에 붙이면 시작을 거부합니다.
            - name: postgres-data
              mountPath: /var/lib/postgresql
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 20
            periodSeconds: 10
          # 포트가 열려도 시작 중(복구 등)이면 접속을 받지 못하므로 실제로 접속을 받는지 봅니다.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
