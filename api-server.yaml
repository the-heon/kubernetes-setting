apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  labels:
    app: api-server
spec:
  replicas: 2  # 원하는 만큼 스케일링 가능
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api-server
          image: daev681/daev681:api-server  # 빌드된 Docker 이미지 이름
          imagePullPolicy: Always  # 강제로 이미지 다운로드
          lifecycle:
            # 내려가기 전에 5초 기다립니다. Service 목록에서 빠지는 동안 들어온 요청이 끊기지 않게 합니다 (k8s 1.30 이상).
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: http
              containerPort: 8080  # 애플리케이션이 열어놓은 포트
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: hmac-secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-refresh-secret
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      imagePullSecrets:
        - name: my-secret  # 시크릿 이름을 여기에 지정
