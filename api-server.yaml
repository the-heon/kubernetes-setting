apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  labels:
    app: api-server
spec:
  replicas: 2  # 원하는 만큼 스케일링 가능
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001  # 이미지(Dockerfile)의 사용자
        runAsGroup: 10001
      containers:
        - name: api-server
          image: daev681/daev681:api-server  # 빌드된 Docker 이미지 이름
          imagePullPolicy: Always  # 강제로 이미지 다운로드
          lifecycle:
            # 내려가기 전에 5초 기다립니다. Service 목록에서 빠지는 동안 들어온 요청이 끊기지 않게 합니다 (k8s 1.30 이상).
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: http
              containerPort: 8080  # 애플리케이션이 열어놓은 포트
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # prod 프로파일은 DB 주소가 꼭 있어야 합니다 (없으면 시작하지 않음). 예전 매니페스트에는 DB·Redis 설정이 없었습니다.
            - name: DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/game_platform
            - name: DATASOURCE_USERNAME
              value: postgres
            - name: DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: postgres-password
            - name: REDIS_HOST
              value: redis-service
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: redis-password
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: hmac-secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-refresh-secret
            # 첫 관리자 계정. 관리자가 한 명도 없을 때만 만들고, 이미 있으면 무시합니다 (api-server InitialAdminInitializer).
            # 첫 배포 뒤에는 Secret 에서 지워도 됩니다. 운영 DB 에는 개발용 관리자(admin@naver.com)를 만들지 않습니다.
            - name: INITIAL_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: initial-admin-email
                  optional: true
            - name: INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: initial-admin-password
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # 루트 파일시스템은 읽기 전용이라, Tomcat·JVM 이 쓰는 임시 파일만 여기에 씁니다.
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
      imagePullSecrets:
        - name: my-secret  # 시크릿 이름을 여기에 지정
