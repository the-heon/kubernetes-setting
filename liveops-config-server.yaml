apiVersion: apps/v1
kind: Deployment
metadata:
  name: liveops-config-server
  labels:
    app: liveops-config-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: liveops-config-server
  template:
    metadata:
      labels:
        app: liveops-config-server
    spec:
      containers:
        - name: liveops-config-server
          image: daev681/daev681:liveops-config-server
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: postgres-database-url
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: my-secret
