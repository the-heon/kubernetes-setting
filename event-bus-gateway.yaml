apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-bus-gateway
  labels:
    app: event-bus-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-bus-gateway
  template:
    metadata:
      labels:
        app: event-bus-gateway
    spec:
      containers:
        - name: event-bus-gateway
          image: daev681/daev681:event-bus-gateway
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: my-secret
