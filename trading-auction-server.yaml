apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-auction-server
  labels:
    app: trading-auction-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trading-auction-server
  template:
    metadata:
      labels:
        app: trading-auction-server
    spec:
      containers:
        - name: trading-auction-server
          image: daev681/daev681:trading-auction-server
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: my-secret
