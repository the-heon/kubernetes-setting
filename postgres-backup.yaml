# Postgres 를 매일 새벽 3시(서울)에 통째로(pg_dumpall: 모든 데이터베이스·계정) 백업합니다. 7일치를 둡니다.
# 백업은 DB 와 다른 PVC 에 둡니다. 잘못 지운 데이터·망가진 DB 는 이것으로 되살릴 수 있지만,
# 같은 노드·같은 저장소라 디스크가 통째로 망가지면 같이 잃습니다. 가끔 클러스터 밖으로 복사해 둡니다 (README 참고).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Seoul
  # 앞 백업이 아직 돌고 있으면 새로 시작하지 않습니다.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dumpall
              image: postgres:18
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  value: postgres-service
                - name: PGUSER
                  value: postgres
                # postgres.yaml 의 POSTGRES_PASSWORD 와 같아야 합니다.
                - name: PGPASSWORD
                  value: postgres
              # pipefail: pg_dumpall 이 실패하면 gzip 이 성공해도 실패로 본다 (sh 는 이걸 못 해서 bash 를 쓴다).
              command: ["bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  file="/backup/all-$(date +%Y%m%d-%H%M).sql.gz"
                  # 다 쓴 뒤에 이름을 바꿔서, 중간에 실패한 파일이 정상 백업처럼 남지 않게 합니다.
                  pg_dumpall | gzip > "$file.partial"
                  mv "$file.partial" "$file"
                  find /backup -name 'all-*.sql.gz' -mtime +7 -delete
                  find /backup -name '*.partial' -delete
                  ls -lh /backup
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: postgres-backup
